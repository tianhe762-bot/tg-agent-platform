name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m flake8 src tests --max-line-length=140

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build release package
        run: bash scripts/release.sh
      - name: "CRLF check (project convention: no CRLF in release)"
        run: |
          PKG=dist/tg-agent-v$(cat VERSION).tar.gz
          tar -xzf "$PKG" -C /tmp
          if grep -rlI $'\r' /tmp/tg-agent-* 2>/dev/null; then
            echo "❌ 发布包内存在 CRLF"
            exit 1
          fi
          echo "✅ 发布包无 CRLF"
      - uses: actions/upload-artifact@v4
        with:
          name: tg-agent-release
          path: dist/
